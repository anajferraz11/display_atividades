<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos Display</title>
    <link rel="stylesheet" href="css/display.css">
</head>
<body>
   <h1>Página de Estudos - Flex Display</h1>

   <!-- block deixa os números um embaixo do outro -->
   <h1>display: block</h1>
   <section class="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
   </section> 

<!-- flex deixa os números um do lado do ouro -->
   <h1>display : flex</h1>
    <section class="container flex">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    </section>

    <!-- direção de linhas -->

    <h1>flex-direction: row</h1>
    <section class="container row">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </section>

    <!-- flex-direction: row-reverse deixa os números ao contrario (321) -->
    <h1>flex-direction: row-reverse</h1>
    <section class="container row-reverse">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </section>

    <h1>flex-direction: column</h1>
    <section class="container column">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </section>

    <h1>flex-direction: columns-reverse</h1>
    <section class="container columns-reverse">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </section>
    
</html>
